<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="manifest" href="/prospect/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/prospect/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CASANOVAX Prospect">
  <title>CASANOVAX Prospect</title>
  <link rel="stylesheet" href="/prospect/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">C</span><span>CASANOVAX <small>Prospect</small></span></div>
    <div class="counters" id="counters"></div>
  </header>

  <section class="controls">
    <div class="row">
      <input id="city" type="text" placeholder="Ville" value="Casablanca" autocomplete="off">
      <input id="country" type="text" placeholder="Pays" value="Morocco" autocomplete="off">
    </div>
    <details class="sectors">
      <summary>Secteurs <b id="secCount"></b></summary>
      <div id="sectorList" class="chips"></div>
    </details>
    <button id="search" class="primary">Chercher les prospects</button>
    <label class="opt"><input type="checkbox" id="showDone"> Afficher les déjà traités</label>
    <p class="status" id="status"></p>
  </section>

  <main id="list" class="list"></main>

  <div class="foot">
    <button id="reset" class="ghost">Réinitialiser l'historique</button>
    <span>Données : OpenStreetMap · Gratuit</span>
  </div>

  <script src="/prospect/app.js"></script>
</body>
</html>
