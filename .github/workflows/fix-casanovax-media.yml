name: Fix CASANOVAX media

on:
  push:
    paths:
      - '.github/workflows/fix-casanovax-media.yml'

permissions:
  contents: write

jobs:
  fix-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace broken Vercel asset paths
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              '/assets/hero-casanovax.webp': 'https://raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/hero-casanovax.webp',
              '/assets/trust-casanovax.webp': 'https://raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/trust-casanovax.webp',
              '/assets/google-casanovax.webp': 'https://raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/google-casanovax.webp',
              '/assets/dr-sonia-logo.webp': 'https://raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/dr-sonia-logo.webp',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate external media URLs
        run: |
          grep -q 'raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/hero-casanovax.webp' index.html
          grep -q 'raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/trust-casanovax.webp' index.html
          grep -q 'raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/google-casanovax.webp' index.html
          grep -q 'raw.githubusercontent.com/Irlsolien/Casanovax212/main/assets/dr-sonia-logo.webp' index.html

      - name: Commit media URL fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix broken media URLs on Vercel' || exit 0
          git push
