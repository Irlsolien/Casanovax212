name: Fix CASANOVAX malformed inline media

on:
  push:
    paths:
      - '.github/workflows/fix-casanovax-media.yml'

permissions:
  contents: write

jobs:
  repair-inline-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed image sources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          bad = 'https://raw.githubusercontent.com/Irlsolien/Casanovax212/maindata:image/webp;base64,'
          count = text.count(bad)
          if count == 0:
              raise SystemExit('Malformed inline image prefix not found')
          text = text.replace(bad, 'data:image/webp;base64,')
          p.write_text(text, encoding='utf-8')
          print(f'Repaired {count} malformed image source(s)')
          PY

      - name: Validate image sources
        shell: bash
        run: |
          ! grep -q 'maindata:image' index.html
          ! grep -q 'raw.githubusercontent.com/Irlsolien/Casanovax212/maindata' index.html
          grep -q 'src="data:image/webp;base64,' index.html
          test $(grep -o 'src="data:image/webp;base64,' index.html | wc -l) -ge 4

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix malformed inline image sources' || exit 0
          git push
